spring:
  datasource:
    url: jdbc:mysql://192.168.0.198:3306/trip_tune_letter?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: dev_team
    password: triptuneletter2222
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
