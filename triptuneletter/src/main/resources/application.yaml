spring:
  application:
    name: triptuneletter

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/realm/protocol/openid-connect/certs}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trip_tune_letter}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1111}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#    open-in-view: false
    properties:
      hibernate:
        format_sql: true
#        default_schema: public
#        jdbc.lob.non_contextual_creation: true

  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}

        chat:
          options:
            model: ${CHAT_MODEL}
            temperature: ${CHAT_TEMPERATURE:0.7}
        embedding:
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
          api-key: ${GOOGLE_GENAI_API_KEY}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: cosine_distance
        index-type: hnsw
        table-name: vector_store

  jackson:
    parser:
      allow-unquoted-control-chars: true
server:
  port: 8081